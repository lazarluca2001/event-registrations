<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1430" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f1fa" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nevezések</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<style>
  /* ---------- tokenek ---------- */
  :root {
    --bg: #f6f1fa;
    --surface: #ffffff;
    --surface-2: #efe7f5;
    --ink: #1d1430;
    --muted: #6e6283;
    --line: #e2d8ea;
    --lead: #0f9e93;
    --follow: #e0457b;
    --accent: #5b3fd1;
    --accent-ink: #ffffff;
    --paper: #fff7e3;
    --paper-ink: #1d1430;
    --hit: #ffd84d;
    --hit-soft: rgba(255, 216, 77, .28);
    --shadow: 0 1px 2px rgba(29, 20, 48, .06), 0 6px 20px rgba(29, 20, 48, .06);
    --r-sm: 8px; --r-md: 14px; --r-lg: 22px;
    --font: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    --top: env(safe-area-inset-top, 0px);
    --bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1430;
      --surface: #271d3d;
      --surface-2: #31264a;
      --ink: #f4eefa;
      --muted: #a99bbf;
      --line: #3a2f55;
      --lead: #3fd6c6;
      --follow: #ff6f9c;
      --accent: #9d86ff;
      --accent-ink: #1d1430;
      --paper: #fff3d1;
      --hit: #ffd84d;
      --hit-soft: rgba(255, 216, 77, .16);
      --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 8px 24px rgba(0, 0, 0, .25);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.4 var(--font); font-variation-settings: "wdth" 100;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ---------- elrendezés ---------- */
  .app { min-height: 100dvh; }
  .panel { padding: calc(20px + var(--top)) 16px calc(32px + var(--bottom)); }
  .main { min-width: 0; }
  @media (min-width: 900px) {
    .app { display: grid; grid-template-columns: 320px minmax(0, 1fr); }
    .panel { position: sticky; top: 0; height: 100dvh; overflow-y: auto; border-right: 1px solid var(--line); }
    .back { display: none !important; }
  }
  @media (max-width: 899px) {
    body.on-event .panel { display: none; }
    body:not(.on-event) .main { display: none; }
  }

  /* ---------- eseménylista (kezdőképernyő / oldalsáv) ---------- */
  .brand { display: flex; align-items: baseline; gap: 10px; margin: 0 4px 18px; }
  .brand h1 { margin: 0; font-size: 30px; line-height: 1; font-weight: 800; letter-spacing: -.02em;
              font-variation-settings: "wdth" 80, "opsz" 96; }
  .brand span { color: var(--muted); font-size: 14px; }

  .idform { display: flex; gap: 8px; margin-bottom: 22px; }
  .idform input { flex: 1; min-width: 0; height: 52px; padding: 0 16px; border-radius: var(--r-md);
                  border: 1.5px solid var(--line); background: var(--surface); font-size: 18px; }
  .idform input:focus { border-color: var(--accent); outline: none; }
  .btn-primary { height: 52px; padding: 0 20px; border: none; border-radius: var(--r-md);
                 background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .btn-primary:disabled { opacity: .5; }

  .listhead { display: flex; justify-content: space-between; align-items: center; margin: 0 4px 10px; }
  .listhead h2 { margin: 0; font-size: 17px; font-weight: 700; }
  .listhead .count { color: var(--muted); font-size: 14px; }
  .evfilter { width: 100%; height: 40px; padding: 0 14px; margin-bottom: 10px; border-radius: 999px;
              border: 1px solid var(--line); background: var(--surface); }
  .evlist { display: flex; flex-direction: column; gap: 8px; }
  .ev { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; width: 100%;
        text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-md);
        background: var(--surface); }
  .ev:hover { border-color: var(--accent); }
  .ev.active { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
  .ev .t { font-weight: 700; font-size: 16px; line-height: 1.25; }
  .ev .s { grid-column: 1; color: var(--muted); font-size: 13px; }
  .ev .go { grid-row: 1 / span 2; grid-column: 2; color: var(--muted); font-size: 20px; }
  .empty-list { color: var(--muted); font-size: 14px; margin: 0 4px; }

  /* ---------- esemény nézet: fejléc ---------- */
  .appbar { position: sticky; top: 0; z-index: 21; background: var(--bg);
            padding: calc(8px + var(--top)) 12px 4px; }
  .barrow { display: flex; align-items: center; gap: 8px; min-height: 52px; }
  .iconbtn { width: 42px; height: 42px; flex: none; display: grid; place-items: center; border-radius: 50%;
             border: none; background: transparent; }
  .iconbtn:hover { background: var(--surface-2); }
  .iconbtn svg { width: 22px; height: 22px; }
  .iconbtn.spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .titlebox { flex: 1; min-width: 0; }
  .titlebox h2 { margin: 0; font-size: 19px; font-weight: 800; line-height: 1.15; letter-spacing: -.01em;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                 font-variation-settings: "wdth" 85, "opsz" 48; }
  .titlebox p { margin: 1px 0 0; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* szűrők – kompakt, görgetéskor behúzódik */
  /* a szűrősáv külön ragad a fejléc alatt; elrejtéskor csak becsúszik alá (az elrendezés nem változik) */
  .filters { position: sticky; top: var(--barh, 64px); z-index: 20; background: var(--bg);
             padding: 0 12px 10px; border-bottom: 1px solid var(--line);
             transition: transform .25s ease; }
  .filters.tuck { transform: translateY(-100%); }
  .strip { display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
           margin: 0 -12px 8px; padding: 2px 12px; }
  .strip::-webkit-scrollbar { display: none; }
  .chip { flex: none; scroll-snap-align: start; position: relative; height: 34px; padding: 0 13px;
          border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
          font-size: 14px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .chip .n { font-size: 12px; color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
  .chip.has-hit::after { content: ''; position: absolute; top: -2px; right: -2px; width: 10px; height: 10px;
                         border-radius: 50%; background: var(--hit); border: 2px solid var(--bg); }
  .controls { display: flex; gap: 8px; align-items: center; }
  .seg { display: flex; flex: none; padding: 3px; border-radius: 999px; background: var(--surface-2); }
  .seg button { height: 32px; padding: 0 12px; border: none; border-radius: 999px; background: transparent;
                font-size: 14px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-weight: 700; }
  .seg button[data-r="Leader"][aria-pressed="true"] { color: var(--lead); }
  .seg button[data-r="Follower"][aria-pressed="true"] { color: var(--follow); }
  .find { flex: 1; min-width: 0; position: relative; }
  .find input { width: 100%; height: 38px; padding: 0 12px 0 34px; border-radius: 999px;
                border: 1px solid var(--line); background: var(--surface); font-size: 15px; }
  .find input:focus { outline: none; border-color: var(--hit); box-shadow: 0 0 0 3px var(--hit-soft); }
  .find svg { position: absolute; left: 11px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--muted); }
  .findinfo { font-size: 12.5px; color: var(--muted); margin: 6px 2px 0; }
  .findinfo:empty { display: none; }
  @media (max-width: 380px) { .seg button { padding: 0 9px; font-size: 13px; } }

  /* ---------- tartalom ---------- */
  .content { padding: 14px 12px calc(40px + var(--bottom)); max-width: 1100px; }
  .stats { display: flex; gap: 8px; margin-bottom: 14px; }
  .stat { flex: 1; min-width: 0; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); }
  .stat b { display: block; font-size: 26px; line-height: 1; font-weight: 800; font-variation-settings: "wdth" 80, "opsz" 72; }
  .stat span { font-size: 13px; color: var(--muted); }
  .stat.lead b { color: var(--lead); }
  .stat.follow b { color: var(--follow); }

  /* divízió-áttekintő egyensúlysávokkal */
  .overview { display: flex; flex-direction: column; gap: 6px; margin-bottom: 22px; }
  .ovrow { display: block; width: 100%; text-align: left; padding: 11px 14px 12px; border-radius: var(--r-md);
           border: 1px solid var(--line); background: var(--surface); }
  .ovrow:hover { border-color: var(--accent); }
  .ovrow.has-hit { border-color: var(--hit); box-shadow: 0 0 0 2px var(--hit-soft); }
  .ovtop { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; margin-bottom: 8px; }
  .ovtop .nm { font-weight: 700; font-size: 15px; }
  .ovtop .tot { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .balance { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
  .balance .l { color: var(--lead); min-width: 2ch; }
  .balance .f { color: var(--follow); min-width: 2ch; text-align: right; }
  .bar { flex: 1; display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--surface-2); gap: 2px; }
  .bar i { display: block; height: 100%; }
  .bar .bl { background: var(--lead); border-radius: 999px 0 0 999px; }
  .bar .bf { background: var(--follow); border-radius: 0 999px 999px 0; }
  .bar .bc { background: var(--accent); border-radius: 999px; }

  /* divízió-szekciók */
  .section { margin-bottom: 26px; scroll-margin-top: 170px; }
  .sechead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 4px 10px; }
  .sechead h3 { margin: 0; font-size: 22px; line-height: 1.1; font-weight: 800; letter-spacing: -.01em;
                font-variation-settings: "wdth" 82, "opsz" 72; }
  .sechead .meta { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .lists { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 700px) { .lists.two { grid-template-columns: 1fr 1fr; } .lists.two.one { grid-template-columns: 1fr; } }
  .group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
  .group > h4 { margin: 0; padding: 12px 16px 10px; font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; }
  .group.lead > h4 { color: var(--lead); }
  .group.follow > h4 { color: var(--follow); }
  .group.lead { border-top: 3px solid var(--lead); }
  .group.follow { border-top: 3px solid var(--follow); }
  .group.couple { border-top: 3px solid var(--accent); }
  .rows { list-style: none; margin: 0; padding: 0 6px 6px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 7px 10px; border-radius: var(--r-sm); }
  .row + .row { border-top: 1px solid var(--line); }
  .row .who { min-width: 0; flex: 1; font-size: 16px; line-height: 1.25; }
  .row .who small { display: block; font-size: 13.5px; color: var(--muted); }
  .row .who small::before { content: '+ '; color: var(--follow); font-weight: 700; }
  .row .note { display: block; font-size: 12px; color: var(--muted); }
  .row.hit { background: var(--hit-soft); border-top-color: transparent; }
  .row.hit + .row { border-top-color: transparent; }
  .row.cur { box-shadow: inset 0 0 0 2px var(--hit); }
  mark { background: var(--hit); color: #1d1430; border-radius: 3px; padding: 0 1px; }

  /* a rajtszám: papír versenyszám tűlyukakkal */
  .bib { flex: none; position: relative; min-width: 46px; height: 32px; padding: 9px 7px 0; border-radius: 5px;
         background: var(--paper); color: var(--paper-ink); text-align: center;
         font-weight: 800; font-size: 16px; line-height: 1; font-variant-numeric: tabular-nums;
         font-variation-settings: "wdth" 75, "opsz" 24;
         box-shadow: 0 1px 0 rgba(0,0,0,.12), inset 0 0 0 1px rgba(29,20,48,.08); }
  .bib::before, .bib::after { content: ''; position: absolute; top: 3px; width: 4px; height: 4px; border-radius: 50%;
                              background: var(--surface); box-shadow: inset 0 0 0 1px rgba(29,20,48,.2); }
  .bib::before { left: 4px; } .bib::after { right: 4px; }

  /* állapotok */
  .state { padding: 60px 24px; text-align: center; color: var(--muted); }
  .state h3 { color: var(--ink); font-size: 22px; margin: 18px 0 6px; font-weight: 800; }
  .state p { margin: 0 auto; max-width: 38ch; }
  .state.err h3 { color: var(--follow); }
  .loader { display: flex; justify-content: center; gap: 10px; }
  .loader .bib { animation: bob 1.1s ease-in-out infinite; }
  .loader .bib:nth-child(2) { animation-delay: .15s; }
  .loader .bib:nth-child(3) { animation-delay: .3s; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
  .statebar { display: flex; padding: calc(8px + var(--top)) 12px 0; }
  .welcome { padding: 80px 32px; color: var(--muted); max-width: 46ch; }
  .welcome h3 { color: var(--ink); font-size: 26px; font-weight: 800; margin: 0 0 8px; }
  @media (max-width: 899px) { .welcome { display: none; } }
</style>
</head>
<body>
<div class="app">

  <!-- Eseménylista: telefonon kezdőképernyő, asztalon oldalsáv -->
  <aside class="panel" id="panel">
    <div class="brand"><h1>Nevezések</h1><span>WCS</span></div>
    <form class="idform" id="idform" autocomplete="off">
      <input id="eventId" inputmode="numeric" placeholder="Event ID" aria-label="scoring.dance event ID">
      <button class="btn-primary" id="go" type="submit">Megnyitás</button>
    </form>
    <div class="listhead"><h2>Események</h2><span class="count num" id="evCount"></span></div>
    <input class="evfilter hidden" id="evFilter" placeholder="Esemény keresése" aria-label="Esemény keresése">
    <div class="evlist" id="evList"></div>
    <p class="empty-list hidden" id="evEmpty">Még nincs lekért esemény. Írd be egy scoring.dance esemény ID-ját: a címben az /events/ utáni szám.</p>
  </aside>

  <!-- Esemény nézet -->
  <main class="main">
    <div class="welcome" id="welcome">
      <h3>Válassz eseményt</h3>
      <p>Bal oldalt a már lekért események vannak. Új eseményhez írd be a scoring.dance event ID-t.</p>
    </div>

    <div id="eventView" class="hidden">
      <header class="appbar" id="appbar">
        <div class="barrow">
          <button class="iconbtn back" id="back" aria-label="Vissza az eseményekhez">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="titlebox">
            <h2 id="evTitle"></h2>
            <p id="evMeta"></p>
          </div>
          <button class="iconbtn" id="refresh" aria-label="Adatok frissítése" title="Adatok frissítése">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
        </div>
      </header>
      <div class="filters" id="filters">
          <div class="strip" id="strip" role="toolbar" aria-label="Divízió"></div>
          <div class="controls">
            <div class="seg" id="seg" role="group" aria-label="Szerep">
              <button data-r="" aria-pressed="true">Mind</button>
              <button data-r="Leader" aria-pressed="false">Leader</button>
              <button data-r="Follower" aria-pressed="false">Follower</button>
            </div>
            <label class="find">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              <input id="q" type="search" placeholder="Név" aria-label="Név kiemelése" enterkeyhint="next">
            </label>
          </div>
          <p class="findinfo" id="findinfo"></p>
      </div>

      <div class="content">
        <div class="stats" id="stats"></div>
        <div class="overview" id="overview"></div>
        <div id="sections"></div>
      </div>
    </div>

    <div id="stateView" class="hidden"></div>
  </main>
</div>

<script>
/* ===== BEÁLLÍTÁS: az Apps Script webapp URL-je ===== */
const API_URL = 'https://script.google.com/macros/s/IDE_JON_A_DEPLOYMENT_ID/exec';

/* ===== Divízió-felismerés ===== */
const LEVEL_DEFS = [
  ['newcomer', /newcomer/i], ['novice', /novice/i], ['intermediate', /intermediate|\binter\b/i],
  ['advanced', /advanced/i], ['allstar', /all[\s-]?stars?/i], ['champion', /champion/i],
  ['open', /\bopen\b/i], ['sophisticated', /soph?isticated/i], ['masters', /masters?/i],
  ['junior', /junior/i], ['invitational', /invitational/i]
];
const levelIdx = name => { const i = LEVEL_DEFS.findIndex(d => d[1].test(name)); return i < 0 ? 50 : i; };

function buildDivisions(rows) {
  const map = new Map();
  rows.forEach(r => {
    const name = (r.competition || '').trim() || '(név nélküli divízió)';
    if (!map.has(name)) map.set(name, []);
    map.get(name).push(r);
  });
  const byBib = (a, b) => a.bib - b.bib;
  const norm = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
  return [...map.entries()].map(([name, list]) => {
    const strictly = /strictly/i.test(name);
    const withPartner = list.filter(r => r.partner).length;
    const isCouple = strictly || (list.length >= 4 && withPartner / list.length >= 0.8);
    const leaders = list.filter(r => r.role === 'Leader').sort(byBib);
    const followers = list.filter(r => r.role === 'Follower').sort(byBib);
    const other = list.filter(r => r.role !== 'Leader' && r.role !== 'Follower').sort(byBib);
    const couples = [];
    if (isCouple) {
      const seen = new Set();
      leaders.forEach(l => { couples.push({ bib: l.bib, leader: l.name, follower: l.partner }); seen.add(norm(l.name) + '|' + norm(l.partner)); });
      followers.forEach(f => {
        const key = norm(f.partner) + '|' + norm(f.name);
        if (!seen.has(key)) { couples.push({ bib: f.bib, leader: f.partner, follower: f.name, followerOnly: true }); seen.add(key); }
      });
      couples.sort(byBib);
    }
    return { name, isCouple, leaders, followers, other, couples, order: (strictly ? 100 : 0) + levelIdx(name) };
  })
  .filter(d => d.leaders.length + d.followers.length > 0 || (d.other.length > 0 && !/^\(név nélküli/.test(d.name)))
  .sort((a, b) => a.order - b.order || a.name.localeCompare(b.name));
}

/* ===== Állapot és segédek ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let current = null, divisions = [], knownEvents = [], loadToken = 0;
const filters = { div: null, role: '', q: '' };
function clearFilters() { filters.div = null; filters.role = ''; filters.q = ''; }

async function api(params) {
  const res = await fetch(API_URL + '?' + new URLSearchParams(params));
  if (!res.ok) throw new Error('A szerver nem válaszolt (HTTP ' + res.status + ').');
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Ismeretlen hiba.');
  return data;
}

/* ===== Cím (hash): #452&div=Strictly%20Novice&role=Leader&q=anna ===== */
function parseHash() {
  const [id, ...rest] = location.hash.replace(/^#/, '').split('&');
  const p = new URLSearchParams(rest.join('&'));
  return { id: /^\d+$/.test(id) ? id : null, div: p.get('div'), role: p.get('role') || '', q: p.get('q') || '' };
}
function writeHash() {
  if (!current) return;
  const p = new URLSearchParams();
  if (filters.div) p.set('div', filters.div);
  if (filters.role) p.set('role', filters.role);
  if (filters.q) p.set('q', filters.q);
  const s = p.toString();
  history.replaceState(history.state, '', '#' + current.eventId + (s ? '&' + s : ''));
}

/* ===== Nézetek ===== */
const backSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
function showState(kind, title, text) {
  $('eventView').classList.add('hidden');
  $('welcome').classList.add('hidden');
  const v = $('stateView');
  v.classList.remove('hidden');
  v.innerHTML = `<div class="statebar"><button class="iconbtn back" data-home aria-label="Vissza az eseményekhez">${backSvg}</button></div>` +
    `<div class="state ${kind === 'err' ? 'err' : ''}">` +
    (kind === 'load' ? '<div class="loader" aria-hidden="true"><span class="bib">1</span><span class="bib">2</span><span class="bib">3</span></div>' : '') +
    `<h3>${esc(title)}</h3><p id="stateText">${esc(text || '')}</p>` +
    (kind === 'err' ? '<p style="margin-top:18px"><button class="btn-primary" id="retry">Újrapróbálás</button></p>' : '') +
    `</div>`;
  v.querySelector('[data-home]').onclick = goHome;
}

function goHome() {
  loadToken++;
  document.body.classList.remove('on-event');
  if (location.hash) history.pushState(null, '', location.pathname + location.search);
  current = null;
  $('eventView').classList.add('hidden');
  $('stateView').classList.add('hidden');
  $('welcome').classList.remove('hidden');
  document.title = 'Nevezések';
  markActive();
  scrollTo(0, 0);
}

function openEvent(id) {
  clearFilters();
  if (parseHash().id !== id) history.pushState(null, '', '#' + id);
  load(id, false);
}

/* ===== Betöltés ===== */
async function load(eventId, refresh) {
  const my = ++loadToken;
  document.body.classList.add('on-event');
  $('eventId').value = '';
  const known = knownEvents.find(e => e.eventId === eventId);
  const t0 = Date.now();
  const title = known ? (known.eventName || 'Event ' + eventId) : 'Event ' + eventId;
  let text = 'Betöltés…';
  if (refresh) $('refresh').classList.add('spin');
  else { showState('load', title, text); scrollTo(0, 0); }
  const tick = setInterval(() => {
    const el = $('stateText');
    if (el && my === loadToken) el.textContent = `${text} (${Math.round((Date.now() - t0) / 1000)} mp)`;
  }, 1000);
  try {
    if (!refresh && !known) {
      try {
        const info = await api({ event: eventId, action: 'info' });
        text = info.sheet ? 'Betöltés…' : 'Első lekérés a scoring.dance-ről. Ez 1–3 percig tart, utána mindenkinek azonnal betölt.';
        if (my === loadToken) showState('load', title, text);
      } catch (e) { /* nem kritikus */ }
    }
    const params = { event: eventId };
    if (refresh) params.refresh = '1';
    const data = await api(params);
    if (my !== loadToken) return;
    current = data;
    if (!current.eventName && known && known.eventName) current.eventName = known.eventName;
    divisions = buildDivisions(current.rows);
    render();
    loadKnown();
  } catch (e) {
    if (my !== loadToken) return;
    if (refresh && current) alert('A frissítés nem sikerült: ' + e.message);
    else {
      showState('err', 'Nem sikerült betölteni', e.message);
      $('retry').onclick = () => load(eventId, false);
    }
  } finally {
    clearInterval(tick);
    $('refresh').classList.remove('spin');
  }
}

/* ===== Esemény megjelenítése ===== */
const bib = n => `<span class="bib num">${esc(n)}</span>`;
const nm = t => `<span class="nm" data-t="${esc(t)}">${esc(t)}</span>`;
const personRows = list => list.map(r =>
  `<li class="row" data-n="${esc(r.name.toLowerCase())}">${bib(r.bib)}<span class="who">${nm(r.name)}</span></li>`).join('');

function render() {
  const name = current.eventName || 'Event ' + current.eventId;
  const when = new Date(current.fetchedAt).toLocaleString('hu-HU', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  $('evTitle').textContent = name;
  $('evMeta').textContent = `Frissítve: ${when}`;
  $('evMeta').title = 'event ID: ' + current.eventId;
  document.title = name;

  const L = divisions.reduce((s, d) => s + d.leaders.length, 0);
  const F = divisions.reduce((s, d) => s + d.followers.length, 0);
  $('stats').innerHTML =
    `<div class="stat"><b class="num">${current.count}</b><span>versenyző</span></div>` +
    `<div class="stat lead"><b class="num">${L}</b><span>leader</span></div>` +
    `<div class="stat follow"><b class="num">${F}</b><span>follower</span></div>`;

  if (filters.div && !divisions.some(d => d.name === filters.div)) filters.div = null;
  $('strip').innerHTML = `<button class="chip" data-k="" aria-pressed="${!filters.div}">Összes</button>` +
    divisions.map((d, i) => `<button class="chip" data-k="${esc(d.name)}" data-i="${i}" aria-pressed="${filters.div === d.name}">${esc(d.name)} <span class="n num">${d.isCouple ? d.couples.length : d.leaders.length + d.followers.length}</span></button>`).join('');

  $('overview').innerHTML = divisions.map((d, i) => {
    let bar;
    if (d.isCouple) {
      bar = `<div class="balance"><div class="bar"><i class="bc" style="width:100%"></i></div><span class="num">${d.couples.length} pár</span></div>`;
    } else {
      const tot = d.leaders.length + d.followers.length || 1;
      bar = `<div class="balance"><span class="l num">${d.leaders.length}</span><div class="bar"><i class="bl" style="width:${d.leaders.length / tot * 100}%"></i><i class="bf" style="width:${d.followers.length / tot * 100}%"></i></div><span class="f num">${d.followers.length}</span></div>`;
    }
    return `<button class="ovrow" data-i="${i}"><div class="ovtop"><span class="nm">${esc(d.name)}</span><span class="tot num">${d.isCouple ? '' : (d.leaders.length + d.followers.length) + ' fő'}</span></div>${bar}</button>`;
  }).join('');

  $('sections').innerHTML = divisions.map((d, i) => {
    let body;
    if (d.isCouple) {
      body = `<div class="lists"><div class="group couple"><h4><span>Párok</span><span class="num">${d.couples.length}</span></h4><ul class="rows">` +
        d.couples.map(c => `<li class="row" data-n="${esc((c.leader + ' ' + c.follower).toLowerCase())}">${bib(c.bib)}<span class="who">${nm(c.leader)}<small>${nm(c.follower)}</small>${c.followerOnly ? '<span class="note">csak a follower nevezett</span>' : ''}</span></li>`).join('') +
        `</ul></div></div>`;
    } else {
      body = `<div class="lists two">` +
        `<div class="group lead" data-role="Leader"><h4><span>Leader</span><span class="num">${d.leaders.length}</span></h4><ul class="rows">${personRows(d.leaders)}</ul></div>` +
        `<div class="group follow" data-role="Follower"><h4><span>Follower</span><span class="num">${d.followers.length}</span></h4><ul class="rows">${personRows(d.followers)}</ul></div>` +
        `</div>`;
    }
    if (d.other.length) body += `<div class="lists" style="margin-top:14px"><div class="group"><h4><span>Szerep nélkül</span><span class="num">${d.other.length}</span></h4><ul class="rows">${personRows(d.other)}</ul></div></div>`;
    const meta = d.isCouple ? `${d.couples.length} pár` : `${d.leaders.length} leader, ${d.followers.length} follower`;
    return `<section class="section" id="sec-${i}"><div class="sechead"><h3>${esc(d.name)}</h3><span class="meta num">${meta}</span></div>${body}</section>`;
  }).join('');

  $('q').value = filters.q;
  syncSeg();
  $('stateView').classList.add('hidden');
  $('welcome').classList.add('hidden');
  $('eventView').classList.remove('hidden');
  $('filters').classList.remove('tuck');
  setBarH();
  markActive();
  applyFilters();
  const act = filters.div && $('strip').querySelector('[aria-pressed="true"]');
  if (act) act.scrollIntoView({ inline: 'center', block: 'nearest' });
}

/* ===== Szűrés + kiemelés ===== */
function highlight(el, q) {
  const t = el.dataset.t;
  if (!q) { el.textContent = t; return; }
  const i = t.toLowerCase().indexOf(q);
  el.innerHTML = i < 0 ? esc(t) : esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length));
}

let hitRows = [], hitPos = -1;
function applyFilters() {
  const q = filters.q.trim().toLowerCase();
  let hits = 0, hitDivs = 0;
  hitRows = []; hitPos = -1;

  divisions.forEach((d, i) => {
    const sec = $('sec-' + i);
    const vis = !filters.div || filters.div === d.name;
    sec.classList.toggle('hidden', !vis);
    sec.querySelectorAll('[data-role]').forEach(g => g.classList.toggle('hidden', !!filters.role && g.dataset.role !== filters.role));
    const two = sec.querySelector('.lists.two');
    if (two) two.classList.toggle('one', !!filters.role);

    let n = 0;
    sec.querySelectorAll('.row').forEach(r => {
      const m = !!q && r.dataset.n.includes(q) && !r.closest('[data-role].hidden');
      r.classList.toggle('hit', m);
      r.classList.remove('cur');
      if (m) { n++; if (vis) hitRows.push(r); }
    });
    sec.querySelectorAll('.nm').forEach(el => highlight(el, q));
    if (n) { hits += n; hitDivs++; }
    $('strip').querySelector(`.chip[data-i="${i}"]`).classList.toggle('has-hit', n > 0);
    $('overview').querySelector(`.ovrow[data-i="${i}"]`).classList.toggle('has-hit', n > 0);
  });

  $('overview').classList.toggle('hidden', !!filters.div);
  $('stats').classList.toggle('hidden', !!filters.div);
  $('findinfo').textContent = !q ? '' : hits
    ? `${hits} találat ${hitDivs} divízióban. Enter: következő találat.`
    : 'Nincs ilyen név ebben az eseményben.';
  writeHash();
}

function jumpToHit(step) {
  if (!hitRows.length) return;
  if (hitPos >= 0) hitRows[hitPos].classList.remove('cur');
  hitPos = (hitPos + step + hitRows.length) % hitRows.length;
  hitRows[hitPos].classList.add('cur');
  hitRows[hitPos].scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function selectDiv(name) {
  filters.div = name || null;
  $('strip').querySelectorAll('.chip').forEach(c =>
    c.setAttribute('aria-pressed', filters.div ? c.dataset.k === filters.div : !c.dataset.k));
  applyFilters();
  scrollTo({ top: 0, behavior: 'smooth' });
  const act = $('strip').querySelector('[aria-pressed="true"]');
  if (filters.div && act) act.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  else $('strip').scrollTo({ left: 0, behavior: 'smooth' });
}
function syncSeg() {
  $('seg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.r === filters.role));
}

/* ===== Interakciók ===== */
$('strip').addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (c) selectDiv(c.dataset.k && filters.div !== c.dataset.k ? c.dataset.k : null);
});
$('overview').addEventListener('click', e => {
  const r = e.target.closest('.ovrow');
  if (r) selectDiv(divisions[r.dataset.i].name);
});
$('seg').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  filters.role = b.dataset.r;
  syncSeg();
  applyFilters();
});
let qT;
$('q').addEventListener('input', e => {
  clearTimeout(qT);
  qT = setTimeout(() => { filters.q = e.target.value; applyFilters(); }, 120);
});
$('q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  clearTimeout(qT);
  if (filters.q !== e.target.value) { filters.q = e.target.value; applyFilters(); }
  jumpToHit(e.shiftKey ? -1 : 1);
});
$('back').addEventListener('click', goHome);
$('refresh').addEventListener('click', () => {
  if (!current || $('refresh').classList.contains('spin')) return;
  if (confirm('Friss adatok lekérése a scoring.dance-ről? Ez 1–3 percig tart.')) load(current.eventId, true);
});
$('idform').addEventListener('submit', e => {
  e.preventDefault();
  const id = $('eventId').value.trim().replace(/^.*\/events\/(\d+).*$/, '$1');
  if (!/^\d+$/.test(id)) { $('eventId').focus(); $('eventId').select(); return; }
  openEvent(id);
});

/* görgetéskor a szűrősáv behúzódik, felfelé görgetve visszajön */
function setBarH() {
  document.documentElement.style.setProperty('--barh', $('appbar').getBoundingClientRect().height + 'px');
}
addEventListener('resize', setBarH);
let lastY = 0;
addEventListener('scroll', () => {
  const y = scrollY, bar = $('filters');
  if (document.activeElement === $('q')) { lastY = y; return; }
  if (y > lastY + 8 && y > 160) bar.classList.add('tuck');
  else if (y < lastY - 8 || y < 60) bar.classList.remove('tuck');
  lastY = y;
}, { passive: true });

addEventListener('popstate', () => {
  const h = parseHash();
  if (!h.id) { if (current || document.body.classList.contains('on-event')) goHome(); return; }
  if (!current || current.eventId !== h.id) { clearFilters(); load(h.id, false); }
});

/* ===== Eseménylista ===== */
async function loadKnown() {
  try {
    const data = await api({ action: 'list' });
    const label = ev => ev.eventName || 'Event ' + ev.eventId;
    knownEvents = (data.events || []).filter(ev => ev && ev.eventId)
      .sort((a, b) => label(a).localeCompare(label(b), 'hu', { sensitivity: 'base', numeric: true }));
    $('evCount').textContent = knownEvents.length || '';
    $('evEmpty').classList.toggle('hidden', knownEvents.length > 0);
    $('evFilter').classList.toggle('hidden', knownEvents.length < 8);
    $('evList').innerHTML = knownEvents.map(ev =>
      `<button class="ev" data-ev="${esc(ev.eventId)}" data-s="${esc((label(ev) + ' ' + ev.eventId).toLowerCase())}">` +
      `<span class="t">${esc(label(ev))}</span>` +
      `<span class="s num">${ev.count ? esc(ev.count) + ' versenyző, ' : ''}#${esc(ev.eventId)}</span>` +
      `<span class="go" aria-hidden="true">›</span></button>`).join('');
    markActive();
    filterEvents();
    if (current && !current.eventName) {
      const k = knownEvents.find(e => e.eventId === current.eventId);
      if (k && k.eventName) { current.eventName = k.eventName; $('evTitle').textContent = k.eventName; document.title = k.eventName; }
    }
  } catch (e) {
    $('evEmpty').classList.remove('hidden');
    $('evEmpty').textContent = 'Az eseménylista most nem tölthető be. Event ID-val továbbra is megnyithatsz eseményt.';
  }
}
function markActive() {
  document.querySelectorAll('#evList .ev').forEach(b => b.classList.toggle('active', !!current && b.dataset.ev === current.eventId));
}
function filterEvents() {
  const q = $('evFilter').value.trim().toLowerCase();
  document.querySelectorAll('#evList .ev').forEach(b => b.classList.toggle('hidden', !!q && !b.dataset.s.includes(q)));
}
$('evFilter').addEventListener('input', filterEvents);
$('evList').addEventListener('click', e => {
  const b = e.target.closest('.ev');
  if (b) openEvent(b.dataset.ev);
});

/* ===== Indulás ===== */
loadKnown();
const start = parseHash();
if (start.id) {
  filters.div = start.div; filters.role = start.role; filters.q = start.q;
  load(start.id, false);
}
</script>
