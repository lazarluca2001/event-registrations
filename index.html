<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WCS nevezési lista</title>
<style>
  :root {
    --bg: #f6f7f4; --card: #ffffff; --ink: #1d2320; --muted: #66706a;
    --line: #dde2dc; --accent: #2f7a4f; --accent-ink: #ffffff; --accent-soft: #e3f0e6; --warn: #b4531f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131614; --card: #1c201d; --ink: #e8ece9; --muted: #98a29b;
            --line: #2f3631; --accent: #6cc28f; --accent-ink: #10180f; --accent-soft: #233a2b; --warn: #f0a070; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); max-width: 1480px; margin: 0 auto; }
  .layout.noside { grid-template-columns: minmax(0, 1fr); max-width: 1200px; }
  .wrap { padding: 24px 16px 64px; min-width: 0; }

  /* oldalsáv */
  .side { position: sticky; top: 0; align-self: start; max-height: 100vh; overflow-y: auto;
          padding: 24px 8px 24px 16px; border-right: 1px solid var(--line); }
  .side details > summary { list-style: none; cursor: default; font-size: 12px; color: var(--muted);
          text-transform: uppercase; letter-spacing: .04em; margin: 4px 8px 10px; }
  .side details > summary::-webkit-details-marker { display: none; }
  .side .sfilter { width: calc(100% - 8px); margin: 0 0 8px; padding: 7px 10px; font-size: 13px; }
  .evlist { display: flex; flex-direction: column; gap: 2px; }
  .evitem { display: block; width: 100%; text-align: left; padding: 8px 10px; border: none; border-radius: 8px;
            background: transparent; color: var(--ink); font-size: 14px; line-height: 1.3; }
  .evitem:hover { background: var(--accent-soft); }
  .evitem.active { background: var(--accent); color: var(--accent-ink); }
  .evitem .n { display: block; font-size: 12px; opacity: .7; margin-top: 2px; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .side { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--line);
            padding: 12px 16px; }
    .side details > summary { cursor: pointer; margin: 0; font-size: 14px; text-transform: none;
            letter-spacing: 0; color: var(--ink); font-weight: 600; }
    .side details > summary::after { content: ' ▾'; color: var(--muted); }
    .side details[open] > summary { margin-bottom: 10px; }
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .hidden { display: none !important; }
  a { color: var(--accent); }
  .tag { font-size: 12px; color: var(--muted); }

  form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text] { font: inherit; padding: 9px 12px; border: 1px solid var(--line);
         border-radius: 8px; background: var(--card); color: var(--ink); width: 160px; }
  button { font: inherit; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--card); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button:disabled { opacity: .5; cursor: default; }
  label.chk { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  #status { margin: 16px 0; color: var(--muted); min-height: 1.4em; }
  #status.err { color: var(--warn); }

  /* chipek */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { font: inherit; font-size: 13px; line-height: 1; padding: 7px 11px; border-radius: 999px;
          border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
          display: inline-flex; gap: 6px; align-items: center; transition: background .12s, border-color .12s; }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip .n { font-size: 11px; opacity: .7; font-variant-numeric: tabular-nums; }
  .chip.ghost { border-style: dashed; color: var(--muted); }

  /* szűrősáv */
  .filters { position: sticky; top: 0; z-index: 5; background: var(--bg);
             padding: 12px 0 10px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
  .frow { display: grid; grid-template-columns: 88px 1fr; gap: 8px; align-items: center; margin-bottom: 6px; }
  .frow > .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  @media (max-width: 640px) { .frow { grid-template-columns: 1fr; gap: 4px; } }
  .fbottom { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .fbottom input { width: 220px; }
  #filterInfo { margin-left: auto; }

  .evhead { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between;
            margin: 8px 0 4px; }
  .evhead h2 { font-size: 20px; margin: 0 0 2px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 16px; margin: 0 0 12px; display: flex; justify-content: space-between; gap: 8px; }
  .card h2 small { color: var(--muted); font-weight: 400; white-space: nowrap; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 13px; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; width: 3.5em; color: var(--muted); }
  .summary td.num { color: var(--ink); width: auto; }
  .summary tbody tr { cursor: pointer; }
  .summary tbody tr:hover td { background: var(--accent-soft); }
  .summary tfoot td { font-weight: 600; border-bottom: none; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cols.single { grid-template-columns: 1fr; }
  @media (max-width: 640px) { .cols { grid-template-columns: 1fr; } }
  mark { background: #ffe58a; color: inherit; border-radius: 2px; }
  :root { --hit: #fff1b8; --hit-line: #e0a800; }
  @media (prefers-color-scheme: dark) { :root { --hit: #3d3410; --hit-line: #d9a400; } }
  tr.hit td { background: var(--hit); }
  tr.hit td:first-child { box-shadow: inset 3px 0 0 var(--hit-line); }
  tr.hit.cur td { outline: 2px solid var(--hit-line); outline-offset: -2px; }
  .card.has-hit { border-color: var(--hit-line); box-shadow: 0 0 0 1px var(--hit-line); }
  .summary tr.has-hit td { background: var(--hit); }
  .chip.has-hit { border-color: var(--hit-line); box-shadow: 0 0 0 1px var(--hit-line); }
  .chip.has-hit::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--hit-line); }
  .chip[aria-pressed="true"].has-hit::before { background: var(--accent-ink); }
  @media (prefers-color-scheme: dark) { mark { background: #6b5a12; } }
</style>
</head>
<body>
<div class="layout noside" id="layout">
<aside class="side hidden" id="known">
  <details id="sideDet" open>
    <summary>Lekért események <span id="knownCount" class="tag"></span></summary>
    <input type="text" class="sfilter" id="sideFilter" placeholder="Szűrés…">
    <nav id="knownList" class="evlist"></nav>
  </details>
</aside>
<main class="wrap">
  <h1>WCS nevezési lista</h1>
  <p class="sub">Írd be a scoring.dance esemény ID-ját (pl. a <code>scoring.dance/…/events/<b>438</b>/…</code> címből).</p>

  <form id="f">
    <input type="text" id="eventId" placeholder="Event ID" inputmode="numeric" required>
    <button class="primary" type="submit" id="go">Lekérés</button>
  </form>

  <div id="status"></div>

  <div id="result" class="hidden">
    <div class="evhead">
      <div>
        <h2 id="evName"></h2>
        <div class="tag" id="meta"></div>
      </div>
      <button id="refreshBtn" type="button">↻ Adatok frissítése</button>
    </div>

    <div class="filters">
      <div class="frow"><span class="lbl">Divízió</span><div class="chips" id="fDiv"></div></div>
      <div class="frow"><span class="lbl">Szerep</span><div class="chips" id="fRole"></div></div>
      <div class="fbottom">
        <input type="text" id="search" placeholder="Név kiemelése…" title="Enter: ugrás a következő találatra">
        <button class="chip ghost" id="reset" type="button">Szűrők törlése</button>
        <span id="filterInfo" class="tag"></span>
      </div>
    </div>

    <div class="card">
      <h2>Összesítés <small id="totals"></small></h2>
      <table class="summary">
        <thead><tr><th>Divízió</th><th class="num">Leader</th><th class="num">Follower</th><th class="num">Pár</th></tr></thead>
        <tbody id="sumBody"></tbody>
        <tfoot><tr><td>Összesen</td><td class="num" id="sumL"></td><td class="num" id="sumF"></td><td class="num" id="sumC"></td></tr></tfoot>
      </table>
    </div>
    <div id="divs"></div>
  </div>
</div>

<script>
/* ===== BEÁLLÍTÁS: ide jön az Apps Script webapp URL-je ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbwjachnu0pwyKuPuMEM05Lv9zIMmNrxzSYSZOWuKnEwWgGvIviarYN80xl5wTYTB2Yd/exec';

/* ===== Divízió-felismerés ===== */
const LEVEL_DEFS = [
  ['newcomer', 'Newcomer', /newcomer/i],
  ['novice', 'Novice', /novice/i],
  ['intermediate', 'Intermediate', /intermediate|\binter\b/i],
  ['advanced', 'Advanced', /advanced/i],
  ['allstar', 'All-Star', /all[\s-]?stars?/i],
  ['champion', 'Champion', /champion/i],
  ['open', 'Open', /\bopen\b/i],
  ['sophisticated', 'Sophisticated', /soph?isticated/i],   // a „Sopisticated” elírást is
  ['masters', 'Masters', /masters?/i],
  ['junior', 'Junior', /junior/i],
  ['invitational', 'Invitational', /invitational/i]
];
const TYPE_DEFS = [
  ['jj', 'Jack&Jill'], ['strictly', 'Strictly'], ['other', 'Egyéb']
];
const ROLE_DEFS = [['Leader', 'Leader'], ['Follower', 'Follower']];

function levelOf(name) {
  const i = LEVEL_DEFS.findIndex(d => d[2].test(name));
  return i < 0 ? { key: 'other', label: 'Egyéb', idx: 50 } : { key: LEVEL_DEFS[i][0], label: LEVEL_DEFS[i][1], idx: i };
}
function typeOf(name) {
  if (/strictly/i.test(name)) return 'strictly';
  if (/jack\s*&?\s*(and\s*)?jill|j\s*&\s*j/i.test(name)) return 'jj';
  return 'other';
}

function buildDivisions(rows) {
  const map = new Map();
  rows.forEach(r => {
    const name = (r.competition || '').trim() || '(név nélküli divízió)';
    if (!map.has(name)) map.set(name, []);
    map.get(name).push(r);
  });
  const byBib = (a, b) => a.bib - b.bib;
  const norm = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
  return [...map.entries()].map(([name, list]) => {
    const level = levelOf(name), type = typeOf(name);
    const withPartner = list.filter(r => r.partner).length;
    const isCouple = type === 'strictly' || (list.length >= 4 && withPartner / list.length >= 0.8);
    const leaders = list.filter(r => r.role === 'Leader').sort(byBib);
    const followers = list.filter(r => r.role === 'Follower').sort(byBib);
    const other = list.filter(r => r.role !== 'Leader' && r.role !== 'Follower').sort(byBib);
    const couples = [];
    if (isCouple) {
      const seen = new Set();
      leaders.forEach(l => { couples.push({ bib: l.bib, leader: l.name, follower: l.partner }); seen.add(norm(l.name) + '|' + norm(l.partner)); });
      followers.forEach(f => {
        const key = norm(f.partner) + '|' + norm(f.name);
        if (!seen.has(key)) { couples.push({ bib: f.bib, leader: f.partner, follower: f.name, followerOnly: true }); seen.add(key); }
      });
      couples.sort(byBib);
    }
    return { name, level, type, isCouple, leaders, followers, other, couples,
             order: (type === 'strictly' ? 100 : 0) + level.idx };
  })
  // üres / név nélküli, szerep nélküli blokkok (pl. az oldal egyéb dobozai) kihagyása
  .filter(d => d.leaders.length + d.followers.length > 0 || (d.other.length > 0 && !/^\(név nélküli/.test(d.name)))
  .sort((a, b) => a.order - b.order || a.name.localeCompare(b.name));
}

/* ===== Állapot ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let current = null, divisions = [];
const filters = { div: null, role: new Set(), q: '' };
function clearFilters() { filters.div = null; filters.role.clear(); filters.q = ''; }

function setStatus(msg, isErr) { $('status').textContent = msg; $('status').className = isErr ? 'err' : ''; }

async function api(params) {
  const res = await fetch(API_URL + '?' + new URLSearchParams(params));
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Ismeretlen hiba');
  return data;
}

/* ===== URL hash: #452&div=Strictly%20Novice&role=Leader&q=anna ===== */
function readHash() {
  const [id, ...rest] = location.hash.replace(/^#/, '').split('&');
  const p = new URLSearchParams(rest.join('&'));
  filters.div = p.get('div') || null;
  filters.role = new Set((p.get('role') || '').split(',').filter(Boolean));
  filters.q = p.get('q') || '';
  return id;
}
function writeHash() {
  if (!current) return;
  const p = new URLSearchParams();
  if (filters.div) p.set('div', filters.div);
  if (filters.role.size) p.set('role', [...filters.role].join(','));
  if (filters.q) p.set('q', filters.q);
  const s = p.toString();
  history.replaceState(null, '', '#' + current.eventId + (s ? '&' + s : ''));
}

/* ===== Betöltés ===== */
async function load(eventId, refresh) {
  $('go').disabled = true;
  $('result').classList.add('hidden');
  const t0 = Date.now();
  let msg = 'Betöltés…';
  setStatus(msg);
  const timer = setInterval(() => setStatus(`${msg} ${Math.round((Date.now() - t0) / 1000)} mp`), 1000);
  try {
    // 1) gyors ellenőrzés: van-e már táblázat?
    if (refresh) {
      msg = 'Adatok frissítése a scoring.dance-ről (1–3 perc)…';
    } else {
      try {
        const info = await api({ event: eventId, action: 'info' });
        if (info.sheet) {
          msg = 'Már lekért esemény, betöltés…';
        } else {
          msg = 'Első lekérés a scoring.dance-ről, ez 1–3 percig tart…';
        }
      } catch (e) { /* ha nem sikerül, simán megyünk tovább */ }
    }
    setStatus(msg);
    // 2) adatok (táblázatból, vagy lekérés + táblázat létrehozása)
    const params = { event: eventId };
    if (refresh) params.refresh = '1';
    current = await api(params);
    divisions = buildDivisions(current.rows);
    render();
    setStatus('');
    loadKnown();
  } catch (e) {
    setStatus('Hiba: ' + e.message, true);
  } finally {
    clearInterval(timer);
    $('go').disabled = false;
  }
}

/* ===== Megjelenítés ===== */
function chip(group, key, label, count, on) {
  return `<button type="button" class="chip" data-g="${group}" data-k="${esc(key)}" aria-pressed="${!!on}">${esc(label)}${count != null ? ` <span class="n">${count}</span>` : ''}</button>`;
}

function renderChips() {
  if (filters.div && !divisions.some(d => d.name === filters.div)) filters.div = null;
  $('fDiv').innerHTML = chip('div', '', 'Összes', null, !filters.div) +
    divisions.map(d => chip('div', d.name, d.name,
      d.isCouple ? d.couples.length : d.leaders.length + d.followers.length, filters.div === d.name)).join('');
  $('fRole').innerHTML = ROLE_DEFS.map(([k, l]) => chip('role', k, l, null, filters.role.has(k))).join('');
}

function personTable(title, list, role) {
  return `<div data-role="${role}"><table><thead><tr><th class="num">#</th><th>${esc(title)} (${list.length})</th></tr></thead><tbody>` +
    list.map(r => `<tr data-n="${esc(r.name.toLowerCase())}"><td class="num">${r.bib}</td><td class="nm" data-t="${esc(r.name)}">${esc(r.name)}</td></tr>`).join('') +
    `</tbody></table></div>`;
}

function render() {
  const when = new Date(current.fetchedAt).toLocaleString('hu-HU', { dateStyle: 'medium', timeStyle: 'short' });
  if (!current.eventName) { // régi cache-elt adat: név az oldalsávból
    const sb = document.querySelector(`#knownList .evitem[data-ev="${current.eventId}"]`);
    if (sb && !/^Event \d+$/.test(sb.firstChild.textContent)) current.eventName = sb.firstChild.textContent;
  }
  $('evName').textContent = current.eventName || ('Event ' + current.eventId);
  document.title = (current.eventName || 'Event ' + current.eventId) + ' – nevezések';
  $('meta').textContent = `Utolsó frissítés: ${when} · event ID: ${current.eventId}`;
  $('totals').textContent = `${current.count} versenyző · ${current.rows.length} nevezés`;

  $('sumBody').innerHTML = divisions.map((d, i) =>
    `<tr data-i="${i}"><td>${esc(d.name)}</td><td class="num">${d.leaders.length}</td><td class="num">${d.followers.length}</td><td class="num">${d.isCouple ? d.couples.length : ''}</td></tr>`).join('');

  $('divs').innerHTML = divisions.map((d, i) => {
    let body;
    if (d.isCouple) {
      body = `<table><thead><tr><th class="num">#</th><th>Leader</th><th>Follower</th></tr></thead><tbody>` +
        d.couples.map(c => `<tr data-n="${esc((c.leader + ' ' + c.follower).toLowerCase())}"><td class="num">${c.bib}</td><td class="nm" data-t="${esc(c.leader)}">${esc(c.leader)}</td><td><span class="nm" data-t="${esc(c.follower)}">${esc(c.follower)}</span>${c.followerOnly ? ' <span class="tag">(csak a follower nevezett)</span>' : ''}</td></tr>`).join('') +
        `</tbody></table>`;
    } else {
      body = `<div class="cols">${personTable('Leader', d.leaders, 'Leader')}${personTable('Follower', d.followers, 'Follower')}</div>`;
    }
    if (d.other.length) body += `<div style="margin-top:12px">${personTable('Szerep nélkül', d.other, 'none')}</div>`;
    const count = d.isCouple ? `${d.couples.length} pár` : `${d.leaders.length} L / ${d.followers.length} F`;
    return `<div class="card" id="div-${i}" data-i="${i}"><h2>${esc(d.name)} <small>${count}</small></h2>${body}</div>`;
  }).join('');

  renderChips();
  markActive();
  $('search').value = filters.q;
  $('result').classList.remove('hidden');
  applyFilters();
}

/* ===== Szűrés + kiemelés ===== */
function divisionVisible(d) {
  return !filters.div || d.name === filters.div;
}

function highlight(cell, q) {
  const t = cell.dataset.t;
  if (!q) { cell.textContent = t; return; }
  const i = t.toLowerCase().indexOf(q);
  cell.innerHTML = i < 0 ? esc(t) : esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length));
}

let hitRows = [], hitPos = -1;

function applyFilters() {
  const q = filters.q.trim().toLowerCase();
  const roleOnly = filters.role.size === 1 ? [...filters.role][0] : null;
  let sL = 0, sF = 0, sC = 0, hits = 0, hitDivs = 0;
  hitRows = []; hitPos = -1;

  divisions.forEach((d, i) => {
    const vis = divisionVisible(d);
    const card = $('div-' + i);

    // szerep: oszlopok elrejtése
    card.querySelectorAll('[data-role]').forEach(col => {
      col.classList.toggle('hidden', !!roleOnly && col.dataset.role !== roleOnly && col.dataset.role !== 'none');
    });
    const cols = card.querySelector('.cols');
    if (cols) cols.classList.toggle('single', !!roleOnly);

    // név: csak kiemelés, nem szűr
    let divHits = 0;
    card.querySelectorAll('tr[data-n]').forEach(tr => {
      const m = !!q && tr.dataset.n.includes(q) && !tr.closest('[data-role].hidden');
      tr.classList.toggle('hit', m);
      tr.classList.remove('cur');
      if (m) { divHits++; if (vis) hitRows.push(tr); }
    });
    card.querySelectorAll('.nm').forEach(c => highlight(c, q));

    card.classList.toggle('hidden', !vis);
    card.classList.toggle('has-hit', divHits > 0);
    const sr = $('sumBody').querySelector(`tr[data-i="${i}"]`);
    sr.classList.toggle('hidden', !vis);
    sr.classList.toggle('has-hit', divHits > 0);
    const ch = $('fDiv').querySelector(`.chip[data-k="${CSS.escape(d.name)}"]`);
    if (ch) { ch.classList.toggle('has-hit', divHits > 0); ch.title = divHits ? `${divHits} találat` : ''; }

    if (vis) { sL += d.leaders.length; sF += d.followers.length; sC += d.isCouple ? d.couples.length : 0; }
    if (divHits) { hits += divHits; hitDivs++; }
  });

  $('sumL').textContent = sL; $('sumF').textContent = sF; $('sumC').textContent = sC || '';
  const active = (filters.div ? 1 : 0) + filters.role.size + (q ? 1 : 0);
  $('reset').classList.toggle('hidden', !active);
  const shown = divisions.filter(divisionVisible).length;
  $('filterInfo').textContent = (q ? (hits ? `„${filters.q.trim()}”: ${hits} találat ${hitDivs} divízióban · ` : `„${filters.q.trim()}”: nincs találat · `) : '') +
    `${shown} / ${divisions.length} divízió`;
  writeHash();
}

/* Enter a névmezőben: ugrás a következő kiemelt sorra */
function jumpToHit(step) {
  if (!hitRows.length) return;
  if (hitPos >= 0) hitRows[hitPos].classList.remove('cur');
  hitPos = (hitPos + step + hitRows.length) % hitRows.length;
  const tr = hitRows[hitPos];
  tr.classList.add('cur');
  tr.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* chipek: divízió = egyszerre egy, szerep = kapcsoló */
document.querySelector('.filters').addEventListener('click', e => {
  const b = e.target.closest('.chip[data-g]');
  if (!b) return;
  const g = b.dataset.g, k = b.dataset.k;
  if (g === 'div') {
    filters.div = (!k || filters.div === k) ? null : k;
    $('fDiv').querySelectorAll('.chip').forEach(c =>
      c.setAttribute('aria-pressed', filters.div ? c.dataset.k === filters.div : !c.dataset.k));
  } else {
    filters.role.has(k) ? filters.role.delete(k) : filters.role.add(k);
    b.setAttribute('aria-pressed', filters.role.has(k));
  }
  applyFilters();
});

$('reset').addEventListener('click', () => {
  clearFilters();
  $('search').value = '';
  renderChips();
  applyFilters();
});

let searchT;
$('search').addEventListener('input', e => {
  clearTimeout(searchT);
  searchT = setTimeout(() => { filters.q = e.target.value; applyFilters(); }, 120);
});
$('search').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); clearTimeout(searchT); filters.q = e.target.value; if (!hitRows.length) applyFilters(); jumpToHit(e.shiftKey ? -1 : 1); }
});

$('sumBody').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-i]');
  if (tr) $('div-' + tr.dataset.i).scrollIntoView({ behavior: 'smooth', block: 'start' });
});

$('f').addEventListener('submit', e => {
  e.preventDefault();
  const id = $('eventId').value.trim();
  if (!/^\d+$/.test(id)) return setStatus('Az event ID csak szám lehet.', true);
  if (!current || current.eventId !== id) clearFilters();
  load(id, false);
});

async function loadKnown() {
  try {
    const data = await api({ action: 'list' });
    const label = ev => ev.eventName || 'Event ' + ev.eventId;
    const evs = (data.events || []).filter(ev => ev && ev.eventId)
      .sort((a, b) => label(a).localeCompare(label(b), 'hu', { sensitivity: 'base', numeric: true }));
    const show = evs.length > 0;
    $('known').classList.toggle('hidden', !show);
    $('layout').classList.toggle('noside', !show);
    if (!show) return;
    $('knownCount').textContent = '(' + evs.length + ')';
    $('sideFilter').classList.toggle('hidden', evs.length < 8);
    $('knownList').innerHTML = evs.map(ev =>
      `<button type="button" class="evitem" data-ev="${esc(ev.eventId)}" data-s="${esc(label(ev).toLowerCase())}" title="event ID: ${esc(ev.eventId)}">${esc(label(ev))}<span class="n">${ev.count ? esc(ev.count) + ' versenyző · ' : ''}#${esc(ev.eventId)}</span></button>`).join('');
    markActive();
    applySideFilter();
  } catch (e) { /* nem kritikus */ }
}
function markActive() {
  document.querySelectorAll('#knownList .evitem').forEach(b =>
    b.classList.toggle('active', !!current && b.dataset.ev === current.eventId));
}
function applySideFilter() {
  const q = $('sideFilter').value.trim().toLowerCase();
  document.querySelectorAll('#knownList .evitem').forEach(b =>
    b.classList.toggle('hidden', !!q && !b.dataset.s.includes(q) && !b.dataset.ev.includes(q)));
}
$('sideFilter').addEventListener('input', applySideFilter);
$('sideDet').querySelector('summary').addEventListener('click', e => {
  if (!matchMedia('(max-width: 860px)').matches) e.preventDefault();
});
// mobilon becsukva indul az oldalsáv
if (matchMedia('(max-width: 860px)').matches) $('sideDet').open = false;

$('knownList').addEventListener('click', e => {
  const b = e.target.closest('[data-ev]');
  if (!b) return;
  if (matchMedia('(max-width: 860px)').matches) $('sideDet').open = false;
  $('eventId').value = b.dataset.ev;
  clearFilters();
  load(b.dataset.ev, false);
});

$('refreshBtn').addEventListener('click', async () => {
  if (!current) return;
  if (!confirm('Új lekérés a scoring.dance-ről (1–3 perc). Indulhat?')) return;
  $('refreshBtn').disabled = true;
  await load(current.eventId, true);
  $('refreshBtn').disabled = false;
});

/* ===== Indulás ===== */
loadKnown();
const fromHash = readHash();
if (/^\d+$/.test(fromHash)) { $('eventId').value = fromHash; load(fromHash, false); }
</script>
</main>
</div>
</body>
</html>
